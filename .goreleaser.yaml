# GoReleaser config: macOS-only universal binary, GitHub Release, Homebrew cask.
version: 2
project_name: coxswain

before:
  hooks:
    - go mod tidy
    # The desktop app's frontend is embedded in the binary.
    - npm --prefix web ci
    - npm --prefix web run build
    # Tests gate main in CI; the release only builds.

builds:
  - id: cox
    main: ./cmd/cox
    binary: cox
    # cgo for the desktop window (WKWebView). Go passes -arch to clang, so
    # both architectures build on one Mac.
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=13.0 # what the release toolchain (Go 1.27) needs anyway
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

universal_binaries:
  - id: cox
    name_template: cox
    replace: true

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_universal"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

homebrew_casks:
  - name: coxswain
    binaries: [cox]
    homepage: https://github.com/hua-ri/coxswain
    description: Ops toolbox (SSH, Kubernetes, Argo) for you and your AI agents
    license: MIT
    # Pushed over SSH with a deploy key that can write only to the tap repo.
    repository:
      owner: hua-ri
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:hua-ri/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # The binary is not notarized yet; remove the quarantine flag Homebrew adds.
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "cox"], chdir: ".", writable_paths: ["cox"], must_succeed: false
